<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pressure Wash</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="gameContainer">

    <!-- HUD sits in normal flow at the top -->
    <div id="hud">
      <div id="topBar">
        <div id="streakDisplay">
          <span id="streakIcon">🔥</span>
          <span id="streakCount">0</span>
        </div>
        <div id="scoreDisplay">
          <span id="scoreValue">0</span>
        </div>
        <div id="soapDisplay">
          <span id="soapIcon">🧼</span>
          <span id="soapCount">3</span>
        </div>
      </div>
      <div id="progressContainer">
        <div id="progressFill"></div>
        <div id="progressLabel">WASH IT CLEAN</div>
      </div>
      <div id="surfaceLabel"></div>
    </div>

    <!-- Game area: fills all space below the HUD -->
    <div id="gameArea">

      <!-- Canvas stack (bottom → top) -->
      <canvas id="cleanCanvas"></canvas>
      <canvas id="dirtyCanvas"></canvas>

      <!-- Completion overlay -->
      <div id="completeOverlay">
        <div id="completeTitle">✨ SPARKLING CLEAN! ✨</div>
        <div id="completeBonusText"></div>
      </div>

      <!-- Particle canvas (top-most) -->
      <canvas id="particleCanvas"></canvas>

      <!-- Hint text (shown on first interaction) -->
      <div id="hintText">Drag to wash ↕ Double-tap for soap 🧼</div>

    </div>

    <!-- Level select screen -->
    <div id="levelSelect" class="hidden">
      <div id="lsHeader">
        <div id="lsTitle">SELECT LEVEL</div>
        <div id="lsSoap">🧼 <span id="lsSoapCount">3</span></div>
      </div>
      <div id="levelGrid"></div>
    </div>

    <!-- Start screen (absolute, covers everything) -->
    <div id="startScreen">
      <div id="startContent">
        <div id="startIcon">💦</div>
        <div id="startTitle">PRESSURE<br>WASH</div>
        <div id="startSub">Blast away the grime!</div>
        <button id="playBtn" type="button">PLAY GAME</button>
        <div id="startHint">Drag to wash &nbsp;·&nbsp; Double-tap for soap 🧼</div>
      </div>
    </div>
  </div>

  <!-- YouTube Playables SDK shim (overridden by real SDK inside YouTube) -->
  <script src="js/ytgame-shim.js"></script>

  <!-- Game modules -->
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/surface.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
